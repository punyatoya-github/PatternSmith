[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-craft-generator"
version = "0.1.0"
description = "Turn photos into printable craft patterns (cross stitch first)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10.1",
    "scikit-learn>=1.4",
    # Reference-quality RGB->Lab and CIEDE2000 (see docs/decisions.md)
    "scikit-image>=0.22",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# Added in later weeks of the Phase 1 plan; installed separately so Week 1-2 stays light.
api = ["fastapi>=0.110", "uvicorn>=0.29", "gradio>=4.30"]
pdf = ["reportlab>=4.1"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "reportlab>=4.1", "pypdf>=4"]

[project.scripts]
craft = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
